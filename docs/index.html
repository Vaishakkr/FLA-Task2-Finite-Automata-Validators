const CLASSIFY = {
 pin: c => /[0-9]/.test(c) ? "D" : "O",
 session: c => c,
 password: c => /[A-Z]/.test(c)?"U":/[a-z]/.test(c)?"L":/[0-9]/.test(c)?"D":"!@#$%^&*()-_=+[]{};:,.?/".includes(c)?"S":"O",
 email: c => /[A-Za-z]/.test(c)?"L":/[0-9]/.test(c)?"D":({".":"DOT","-":"HY","_":"US","@":"AT"}[c]||"O")
};
const sel = document.getElementById("app"), inp = document.getElementById("inp");
for (const k in A) sel.add(new Option(A[k].title, k));
function run(){
 const k = sel.value, d = A[k], s = inp.value;
 let st = d.start; const rows = [], visited = new Set([st]);
 [...s].forEach((ch,i)=>{const sym = CLASSIFY[k](ch);
   const nx = d.alphabet.includes(sym) ? (d.delta[st+"|"+sym]||"qD") : "qD";
   rows.push(`<tr><td>${i+1}</td><td>${st}</td><td>${ch===" "?"&#9251;":ch}</td><td>${sym}</td><td>${nx}</td></tr>`);
   st = nx; visited.add(st);});
 const ok = d.accepting.includes(st);
 const v = document.getElementById("verdict");
 v.className = "verdict " + (ok?"ok":"bad");
 v.textContent = (ok?"ACCEPTED":"REJECTED") + " - final state " + st;
 document.getElementById("trace").innerHTML = rows.join("");
 const dg = document.getElementById("diagram");
 dg.querySelectorAll("g.node").forEach(g=>{const t=g.querySelector("title").textContent;
   g.classList.toggle("cur", t===st); g.classList.toggle("visited", visited.has(t)&&t!==st);});
}
function load(){
 const k = sel.value, d = A[k];
 document.getElementById("diagram").innerHTML = SVG[k] || "<p><small>The minimal password DFA has "+d.states+" states, too many to draw usefully. The trace below still shows every transition. See docs/diagrams/password_coverage.svg for the 16-state class-coverage part.</small></p>";
 document.getElementById("chips").innerHTML =
   d.examples.accept.map(x=>`<span class="a">${x||"(empty)"}</span>`).join("") +
   d.examples.reject.map(x=>`<span class="r">${x||"(empty)"}</span>`).join("");
 document.querySelectorAll("#chips span").forEach(sp=>sp.onclick=()=>{inp.value = sp.textContent==="(empty)"?"":sp.textContent; run();});
 document.getElementById("info").textContent = d.name + " - " + d.states + " live states; alphabet {" + d.alphabet.join(", ") + "}";
 inp.value = d.examples.accept[0]; run();
}
sel.onchange = load; inp.oninput = run;
const h = new URLSearchParams(location.hash.slice(1));
if (h.get("app")) sel.value = h.get("app");
load();
if (h.has("s")) { inp.value = h.get("s"); run(); }
